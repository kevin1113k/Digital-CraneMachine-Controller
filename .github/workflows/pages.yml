# 每次 push 到 main 就把網頁發布到 GitHub Pages
# 需在 Settings → Pages → Source 選「GitHub Actions」
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 準備網站檔案
        run: |
          mkdir _site
          cp -r public index.html .nojekyll _site/
          BUILD=${GITHUB_SHA::7}
          sed -i "s/__BUILD__/$BUILD/g" _site/public/index.html _site/public/app.js
          echo "{\"build\":\"$BUILD\"}" > _site/public/version.json
          grep -c "$BUILD" _site/public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
